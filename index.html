<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="PARCO_DEI_MONACI">
  <meta name="author" content="ARCANGELO PRIORE">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Potree Viewer – PARCO DEI MONACI</title>

  <link rel="stylesheet" href="./build/potree/potree.css">
  <link rel="stylesheet" href="./libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="./libs/openlayers3/ol.css">
  <link rel="stylesheet" href="./libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="./libs/jstree/themes/mixed/style.css">

  <style>
    #vr_button_container{
      position:absolute;
      z-index:10000;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      pointer-events:auto;
    }
  </style>
</head>

<body>

  <div class="potree_container" style="position:absolute; width:100%; height:100%; left:0; top:0;">
    <div id="potree_render_area"
         style="background-image:url('./build/potree/resources/images/NUOVO_LOGO_FAI.jpg');">
    </div>
    <div id="potree_sidebar_container"></div>
    <div id="vr_button_container"></div>
  </div>

  <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./libs/spectrum/spectrum.js"></script>
  <script src="./libs/other/BinaryHeap.js"></script>
  <script src="./libs/tween/tween.min.js"></script>
  <script src="./libs/d3/d3.js"></script>
  <script src="./libs/proj4/proj4.js"></script>
  <script src="./libs/openlayers3/ol.js"></script>
  <script src="./libs/i18next/i18next.js"></script>
  <script src="./libs/jstree/jstree.js"></script>
  <script src="./libs/plasio/js/laslaz.js"></script>
  <script src="./build/potree/potree.js"></script>

  <script type="module">
    import { VRButton } from "./libs/three.js/webxr/VRButton.js";

    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(12000000);
    viewer.loadSettingsFromURL();
    viewer.setDescription("Parco dei Monaci - PointCloud");

    viewer.loadGUI(() => {
      viewer.setLanguage("en");
      $("#menu_appearance").next().show();
    });

    function addPointSizeSliderToAppearance(material) {
      const $appearancePanel = $("#menu_appearance").next();

      if ($appearancePanel.length === 0) {
        setTimeout(() => addPointSizeSliderToAppearance(material), 200);
        return;
      }

      $("#ap_pointsize_block").remove();

      const typeToValue = t =>
        t === Potree.PointSizeType.ATTENUATED ? "ATTENUATED" :
        t === Potree.PointSizeType.ADAPTIVE ? "ADAPTIVE" :
        "FIXED";

      const valueToType = v =>
        v === "ATTENUATED" ? Potree.PointSizeType.ATTENUATED :
        v === "ADAPTIVE" ? Potree.PointSizeType.ADAPTIVE :
        Potree.PointSizeType.FIXED;

      const block = $(`
        <div class="pv-menu-list" id="ap_pointsize_block">
          <div class="pv-menu-entry">

            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span>Point size</span>
              <span id="ap_pointsize_val">${material.size.toFixed(1)}</span>
            </div>

            <div id="ap_pointsize_slider" style="margin:0 4px;"></div>

            <div id="ap_pointsize_note"
                 style="margin-top:6px; font-size:11px; color:#999; display:none;">
              controlled by distance
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:8px;">
              <span>Size mode</span>
              <select id="ap_pointsize_type" style="width:140px;">
                <option value="FIXED">Fixed</option>
                <option value="ATTENUATED">Attenuated</option>
                <option value="ADAPTIVE">Adaptive</option>
              </select>
            </div>

          </div>
        </div>
      `);

      const $fovBlock = $appearancePanel.find(".pv-menu-list").first();
      $fovBlock.after(block);

      $("#ap_pointsize_type").val(typeToValue(material.pointSizeType));

      $("#ap_pointsize_slider").slider({
        min: 0.5,
        max: 10,
        step: 0.1,
        value: material.size,
        slide: function (e, ui) {
          material.size = ui.value;
          $("#ap_pointsize_val").text(ui.value.toFixed(1));
        }
      });

      function applyMode(mode) {
        const $slider = $("#ap_pointsize_slider");
        const $note = $("#ap_pointsize_note");

        if (mode === "ATTENUATED") {
          $slider.slider("disable");
          $note.show();
          return;
        }

        $slider.slider("enable");
        $note.hide();

        if (mode === "ADAPTIVE") {
          $slider.slider("option", "max", 3);

          if ($slider.slider("value") > 3) {
            $slider.slider("value", 3);
            material.size = 3;
            $("#ap_pointsize_val").text("3.0");
          }
        } else {
          $slider.slider("option", "max", 10);
        }
      }

      applyMode(typeToValue(material.pointSizeType));

      $("#ap_pointsize_type").on("change", function () {
        const mode = $(this).val();
        material.pointSizeType = valueToType(mode);
        applyMode(mode);
      });
    }

    let xrPointCloud = null;

    Potree.loadPointCloud(
      "pointclouds/parco_dei_monaci/cloud.js",
      "Parco dei Monaci - PointCloud",
      function (e) {
        const pc = e.pointcloud;
        xrPointCloud = pc;
        const mat = pc.material;

        mat.activeAttributeName = "rgba";
        mat.size = 2.0;
        mat.minSize = 2;
        mat.pointSizeType = Potree.PointSizeType.FIXED;

        viewer.scene.addPointCloud(pc);
        viewer.fitToScreen();

        addPointSizeSliderToAppearance(mat);
      }
    );

    let edlBeforeXR = true;

    const xrControllers = { left: null, right: null };
    const xrGamepads = { left: null, right: null };

    const xrMoveState = {
      forward: 0,
      strafe: 0
    };

    const xrTurnState = {
      canSnap: true
    };

    const XR_MOVE_SPEED = 0.06;
    const XR_DEADZONE = 0.15;
    const XR_SNAP_THRESHOLD = 0.7;
    const XR_SNAP_ANGLE = Math.PI / 8;

    function getPotreeRenderer() {
      return viewer.renderer || viewer.pRenderer?.renderer || null;
    }

    function applyDeadzone(value, deadzone = XR_DEADZONE) {
      return Math.abs(value) < deadzone ? 0 : value;
    }

    function registerXRController(controller) {
      controller.addEventListener("connected", (event) => {
        const handedness = event.data.handedness || "none";
        const gamepad = event.data.gamepad || null;

        if (handedness === "left" || handedness === "right") {
          xrControllers[handedness] = controller;
          xrGamepads[handedness] = gamepad;
          console.log(`XR controller connected: ${handedness}`);
        }
      });

      controller.addEventListener("disconnected", () => {
        for (const hand of ["left", "right"]) {
          if (xrControllers[hand] === controller) {
            xrControllers[hand] = null;
            xrGamepads[hand] = null;
            console.log(`XR controller disconnected: ${hand}`);
          }
        }
      });
    }

    function getCameraForwardOnGround(camera) {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      dir.y = 0;

      if (dir.lengthSq() === 0) {
        return new THREE.Vector3(0, 0, -1);
      }

      return dir.normalize();
    }

    function getCameraRightOnGround(camera) {
      const forward = getCameraForwardOnGround(camera);
      return new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
    }

    function updateXRThumbsticks() {
      const leftGp = xrGamepads.left;
      const rightGp = xrGamepads.right;

      xrMoveState.forward = 0;
      xrMoveState.strafe = 0;

      if (leftGp && leftGp.axes && leftGp.axes.length >= 2) {
        xrMoveState.strafe = applyDeadzone(leftGp.axes[0]);
        xrMoveState.forward = applyDeadzone(leftGp.axes[1]);
      }

      if (rightGp && rightGp.axes && rightGp.axes.length >= 2) {
        const turnX = applyDeadzone(rightGp.axes[0]);

        if (xrTurnState.canSnap) {
          if (turnX >= XR_SNAP_THRESHOLD) {
            viewer.scene.view.yaw -= XR_SNAP_ANGLE;
            xrTurnState.canSnap = false;
          } else if (turnX <= -XR_SNAP_THRESHOLD) {
            viewer.scene.view.yaw += XR_SNAP_ANGLE;
            xrTurnState.canSnap = false;
          }
        }

        if (Math.abs(turnX) < 0.2) {
          xrTurnState.canSnap = true;
        }
      }
    }

    function moveViewerInXR() {
      const camera = viewer.scene.getActiveCamera();
      if (!camera) return;

      const forward = getCameraForwardOnGround(camera);
      const right = getCameraRightOnGround(camera);

      const moveForward = -xrMoveState.forward;
      const moveStrafe = xrMoveState.strafe;

      const move = new THREE.Vector3();
      move.add(forward.multiplyScalar(moveForward * XR_MOVE_SPEED));
      move.add(right.multiplyScalar(moveStrafe * XR_MOVE_SPEED));

      viewer.scene.view.position.add(move);
    }

    function setupWebXR() {
      const renderer = getPotreeRenderer();

      if (!renderer) {
        console.warn("WebXR: renderer Potree non trovato.");
        return;
      }

      if (!renderer.xr) {
        console.warn("WebXR: renderer.xr non disponibile.");
        return;
      }

      renderer.xr.enabled = true;

      if (renderer.xr.setReferenceSpaceType) {
        renderer.xr.setReferenceSpaceType("local");
      }

      const controller0 = renderer.xr.getController(0);
      const controller1 = renderer.xr.getController(1);

      registerXRController(controller0);
      registerXRController(controller1);

      renderer.xr.addEventListener("sessionstart", () => {
        edlBeforeXR = viewer.useEDL;
        viewer.setEDLEnabled(false);

        if (xrPointCloud) {
          xrPointCloud.rotation.x = -Math.PI / 2;
          xrPointCloud.updateMatrixWorld(true);
        }

        console.log("WebXR session started: EDL temporarily disabled, XR rotation applied.");
      });

      renderer.xr.addEventListener("sessionend", () => {
        viewer.setEDLEnabled(edlBeforeXR);

        if (xrPointCloud) {
          xrPointCloud.rotation.x = 0;
          xrPointCloud.updateMatrixWorld(true);
        }

        xrControllers.left = null;
        xrControllers.right = null;
        xrGamepads.left = null;
        xrGamepads.right = null;

        console.log("WebXR session ended: EDL restored, XR rotation removed.");
      });

      const vrButton = VRButton.createButton(renderer);
      document.getElementById("vr_button_container").appendChild(vrButton);
    }

    function waitForRendererAndSetupXR(retries = 50) {
      const renderer = getPotreeRenderer();

      if (renderer) {
        setupWebXR();
        return;
      }

      if (retries > 0) {
        setTimeout(() => waitForRendererAndSetupXR(retries - 1), 200);
      } else {
        console.warn("WebXR: impossibile inizializzare il renderer Potree.");
      }
    }

    waitForRendererAndSetupXR();

    function xrControlLoop() {
      const renderer = getPotreeRenderer();

      if (renderer && renderer.xr && renderer.xr.isPresenting) {
        updateXRThumbsticks();
        moveViewerInXR();
      }

      requestAnimationFrame(xrControlLoop);
    }

    xrControlLoop();
  </script>

</body>
</html>
